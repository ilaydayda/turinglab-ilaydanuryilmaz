name: "unary_to_binary"
description: >
  Tekli (unary) gösterimi ikili (binary) sayıya çevirir.
  Girdi: 1^n  (örn. 111 → 3 sayısının unary gösterimi)
  Çıktı: n'nin binary gösterimi (örn. 11)

  Strateji: Şeritteki 1'leri teker teker X ile işaretle,
  her işaretlemede bir sayaç (ikili) bir artır.
  Sayaç ayrı bir bölgede # ile ayrılarak tutulur.
  Tüm 1'ler X olunca # solundaki binary sayı sonuçtur.

  Örnek adımlar (111 → 11):
    Başlangıç:  111
    Adım 1:     X11 | sayaç: 1
    Adım 2:     XX1 | sayaç: 10
    Adım 3:     XXX | sayaç: 11
    Son şerit:  11

states:
  - q_find_one      # işaretlenmemiş 1 ara
  - q_mark          # 1'i X yap, sağdaki sayacı artırmaya git
  - q_inc_right     # sayaç bölgesine git
  - q_inc_c0        # carry=0, sayacı artır (sağdan sola)
  - q_inc_c1        # carry=1, sayacı artır
  - q_return        # başa dön, bir sonraki 1'i ara
  - q_cleanup_left  # X'leri ve #'yi temizle, sayacı başa taşı
  - q_copy_right    # sayacı sola kopyala (varsa)
  - q_accept

input_alphabet: ["1"]
tape_alphabet:  ["0", "1", "X", "#", "B"]
blank: "B"
start_state: q_find_one
accept_states: [q_accept]

transitions:
  # ── q_find_one: işaretlenmemiş 1 ara ──────────────────────────────
  - {state: q_find_one, read: "1", write: "X", move: R, next: q_inc_right}
  - {state: q_find_one, read: "X", write: "X", move: R, next: q_find_one}
  # # işaretine ulaştık → tüm 1'ler işaretlendi, temizlemeye geç
  - {state: q_find_one, read: "#", write: "#", move: L, next: q_cleanup_left}
  # Hiç # yoksa (ilk geçiş öncesi B'ye ulaştık) → sayaç alanı oluştur
  - {state: q_find_one, read: "B", write: "#", move: R, next: q_find_one}

  # ── q_inc_right: # sembolüne kadar sağa git ───────────────────────
  - {state: q_inc_right, read: "X", write: "X", move: R, next: q_inc_right}
  - {state: q_inc_right, read: "1", write: "1", move: R, next: q_inc_right}
  - {state: q_inc_right, read: "0", write: "0", move: R, next: q_inc_right}
  - {state: q_inc_right, read: "#", write: "#", move: R, next: q_inc_right}
  # Sayaç alanının sonuna (B) geldik → sola dön, sayacı artır (carry=1)
  - {state: q_inc_right, read: "B", write: "B", move: L, next: q_inc_c1}

  # ── q_inc_c1: carry=1 ile sayacı artır (sağdan sola) ─────────────
  - {state: q_inc_c1, read: "0", write: "1", move: L, next: q_return}
  - {state: q_inc_c1, read: "1", write: "0", move: L, next: q_inc_c1}
  # # sembolüne ulaştık: yeni bit ekle
  - {state: q_inc_c1, read: "#", write: "#", move: R, next: q_inc_newbit}

  # Yeni bit ekleme durumu
  - {state: q_inc_newbit, read: "0", write: "1", move: L, next: q_return}
  - {state: q_inc_newbit, read: "1", write: "1", move: L, next: q_return}
  - {state: q_inc_newbit, read: "B", write: "1", move: L, next: q_return}

  # ── q_return: X'lerin başına dön ─────────────────────────────────
  - {state: q_return, read: "0", write: "0", move: L, next: q_return}
  - {state: q_return, read: "1", write: "1", move: L, next: q_return}
  - {state: q_return, read: "#", write: "#", move: L, next: q_return}
  - {state: q_return, read: "X", write: "X", move: L, next: q_return}
  - {state: q_return, read: "B", write: "B", move: R, next: q_find_one}

  # ── q_cleanup_left: X'leri sil, sonucu elde et ───────────────────
  - {state: q_cleanup_left, read: "X", write: "B", move: L, next: q_cleanup_left}
  - {state: q_cleanup_left, read: "#", write: "B", move: R, next: q_accept}
  - {state: q_cleanup_left, read: "B", write: "B", move: R, next: q_accept}